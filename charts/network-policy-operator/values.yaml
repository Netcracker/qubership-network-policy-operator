# Default values for network-policy-operator.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""


# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 1

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/ 
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  # fsGroup: 2000

#This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: "network-policy-operator"

leaderElection:
  role: leader-election-role
  rolebinding: leader-election-rolebinding

manager:
  # This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
  image:
    repository: ghcr.io/netcracker/qubership-network-policy-operator
    # This sets the pull policy for images.
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion.
    #tag: "0.4.0"

  # This is for the secretes for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
  imagePullSecrets: []
  
  rbac:
    create: true
    role: network-policy-operator-role
    rolebinding: network-policy-operator-rolebinding

  securityContext:
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - "ALL"
    # capabilities:
    #   drop:
    #   - ALL
    # readOnlyRootFilesystem: true
    # runAsNonRoot: true
    # runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault
  
  resources: 
    # We usually recommend not to specify default resources and to leave this as a conscious
    # choice for the user. This also increases chances charts run on environments with little
    # resources, such as Minikube. If you do want to specify resources, uncomment the following
    # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

  # This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
  livenessProbe:
    httpGet:
      path: /healthz
      port: 8081
    initialDelaySeconds: 15
    periodSeconds: 20
  readinessProbe:
    httpGet:
      path: /readyz
      port: 8081
    initialDelaySeconds: 5
    periodSeconds: 10

  # Additional volumes on the output Deployment definition.
  volumes: []
  # - name: foo
  #   secret:
  #     secretName: mysecret
  #     optional: false
  
  # Additional volumeMounts on the output Deployment definition.
  volumeMounts: []
  # - name: foo
  #   mountPath: "/etc/foo"
  #   readOnly: true

authProxy:
  image:
    repository: gcr.io/kubebuilder/kube-rbac-proxy
    # This sets the pull policy for images.
    pullPolicy: IfNotPresent
    tag: "v0.15.0"

  # This is for the secretes for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
  imagePullSecrets: []

  securityContext:
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - "ALL"
    seccompProfile:
      type: RuntimeDefault

  resources: 
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi

  rbac:
    create: true
    role: network-policy-operator-proxy-role
    rolebinding: network-policy-operator-proxy-rolebinding
    metrics: metrics-reader

nodeSelector: {}

tolerations: []

# A Kubernetes Affinity, if required. For example:
#   affinity:
#     nodeAffinity:
#      requiredDuringSchedulingIgnoredDuringExecution:
#        nodeSelectorTerms:
#        - matchExpressions:
#          - key: foo.bar.com/role
#            operator: In
#            values:
#            - worker
affinity: {}

monitoring:
  enable: false

# NetworkPolicyConfig section
networkPolicies:
  name: "default"
  enabled: true
  # Namespace label that indicates processed namespaces, e.g.:
  # scope:
  #   my-lable: skiped-namespace
  scope: {}
  # Namespace annotation that is a coma separated list of namespaces from where access must be allowed
  allowAnnotation: "network-policy.qubership.org/allowed-from"
  # List of namespaces prefixes that are not restricted by NetworkPlolicies, therefore connections to pods in that namespaces are allowed
  # `kube-` means `kube-sytem`, `kube-public` `kube-node-lease` namespace are not resticted
  controlPlane: "kube-,openshift,calico,tigera,ingress-nginx"
  # Coma separated list of namespaces that are implicitly added to the 'allowed' namespaces
  implicitNamespaces: "openshift-monitoring,platform-monitoring,ingress-nginx,openshift-ingress"
  # Custom NetworkPolicies in Calico notation
  customPolicies: ""
  logs:
    enabled: false
    collectingAll: true
    namespaceScope: "network-policy.qubership.org/collecting-logs"
  # Default NetwokPolicies Tier
  defaultTier: automated
  # NetwokPolicies Tier for custom NetworkPolicies
  customTier: default
# RemoteClusterConfig section
dr:
  install: false
  localCluster: {}
#  localCluster:
#    api: cluster-1.domain.com:6443
#    name: cluster-1
#    secret: cluster-1-secret
  remoteClusters: []
#  remoteClusters:
#    - name: cluster-2
#      api: cluster-2.domain.com:6443
#      secret: cluster-2-secret
#    - name: cluster-3
#      api: cluster-3.domain.com:6443
#      secret: cluster-3-secret
  # There are two options: `token` and `tls`
  authentication: token
  # `auto` runs the TLS certificate creation job, `manual` means the TLS certificate has been created maually
  tls: auto
  tlsJob:
    image:
      repository: ghcr.io/netcracker/qubership-network-policy-job
      #tag: "0.4.0"
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
    nodeSelector:
      kubernetes.io/os: linux
    tolerations: []
    securityContext:
      runAsNonRoot: true
