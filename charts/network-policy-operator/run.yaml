# Source: network-policy-operator/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: npo-network-policy-operator
  labels:
    helm.sh/chart: network-policy-operator-0.3.2
    app.kubernetes.io/name: network-policy-operator
    app.kubernetes.io/instance: npo
    app.kubernetes.io/version: "main"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: operator
    app.kubernetes.io/technology: go
    app.kubernetes.io/part-of: npo
    name: npo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: network-policy-operator
      app.kubernetes.io/instance: npo
  template:
    metadata:
      labels:
        helm.sh/chart: network-policy-operator-0.3.2
        app.kubernetes.io/name: network-policy-operator
        app.kubernetes.io/instance: npo
        app.kubernetes.io/version: "main"
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/component: operator
        app.kubernetes.io/technology: go
        app.kubernetes.io/part-of: npo
        name: npo
    spec:
      serviceAccountName: network-policy-operator
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
      containers:
        - command:
          - /manager
          args:
          - --health-probe-bind-address=:8081
          - --metrics-bind-address=:8443
          - --metrics-secure=true
          - --leader-elect
          - --zap-log-level=error
          name: manager
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          image: artifactorycn.netcracker.com:17152/netcracker/qubership-network-policy-operator:0.7.2
          imagePullPolicy: IfNotPresent
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
