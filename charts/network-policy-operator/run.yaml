apiVersion: netcracker.com/v1alpha1
kind: NetworkPolicyConfig
metadata:
  annotations:
    "helm.sh/hook": post-install, post-upgrade
  labels:
    helm.sh/chart: network-policy-operator-0.3.2
    app.kubernetes.io/name: network-policy-operator
    app.kubernetes.io/instance: npo
    app.kubernetes.io/version: "main"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: operator
    app.kubernetes.io/technology: go
    app.kubernetes.io/part-of: npo
    name: npo
  name: default
spec:
  enabled: true
  allowAnnotation: "network-policy.netcracker.com/allowed-from"
  controlPlane: "kube-,openshift,calico,tigera,ingress-nginx"
  implicitNamespaces: "openshift-monitoring,platform-monitoring,ingress-nginx,openshift-ingress,monitoring"
  logs:
    enabled: false
    collectingAll: true
    namespaceScope: network-policy.netcracker.com/collecting-logs
  defaultTier: automated
  customTier: default
  policies:
    AllowWithinNamespace: |
      apiVersion: projectcalico.org/v3
      kind: NetworkPolicy
      metadata:
        name: allow-within-ns
        namespace: default
      spec:
        selector: all()
        types:
          - Ingress
        ingress:
          - action: Allow
            source:
              selector: all()
    AllowFromNamespace: |
      apiVersion: projectcalico.org/v3
      kind: NetworkPolicy
      metadata:
        name: allow-from-ns
        namespace: default
      spec:
        selector: all()
        types:
          - Ingress
        ingress:
          - action: Log
            source:
              nets:
                - 0.0.0.0/0
          - action: Allow
            source:
              namespaceSelector: all()
    DefaultDeny: |
      apiVersion: projectcalico.org/v3
      kind: NetworkPolicy
      metadata:
        name: default-deny
        namespace: default
      spec:
        selector: all()
        ingress:
          - action: Log
            source:
              nets:
                - 0.0.0.0/0
        types:
          - Ingress
    DefaultLog: |
      apiVersion: projectcalico.org/v3
      kind: NetworkPolicy
      metadata:
        name: default-log
        namespace: default
      spec:
        selector: all()
        ingress:
          - action: Log
            source:
              nets:
                - 0.0.0.0/0
          - action: Allow
            source:
              nets:
                - 0.0.0.0/0
        types:
          - Ingress
    RestrictService: |
      apiVersion: projectcalico.org/v3
      kind: NetworkPolicy
      metadata:
        name: restrict-service
      spec:
        order: 10
        egress:
        - action: Allow
