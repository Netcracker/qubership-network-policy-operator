{{- if .Values.dr.install }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    {{- include "network-policy-operator.labels" . | nindent 4 }}
  name: {{ .Values.dr.localCluster.name }}-rb
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
- kind: ServiceAccount
  name: {{ .Values.dr.localCluster.name }}
  namespace: {{ include "network-policy-operator.namespace" . }}
{{- end }}
