{{- $outer := . -}}
{{- if .Values.dr.install }}
{{- range $key, $value := .Values.dr.remoteClusters }}
{{- with $outer -}}
---
apiVersion: qubership.org/v1alpha1
kind: RemoteClusterConfig
metadata:
  labels:
    {{- include "network-policy-operator.labels" . | nindent 4 }}
  name: remoteclusterconfig-{{ $value.name }}
spec:
  localCluster:
    api: {{ $.Values.dr.localCluster.api }}
    name: {{ $.Values.dr.localCluster.name }}
  remoteCluster:
    api: {{ $value.api }}
    name: {{ $value.name }}
    {{- if eq $.Values.dr.authentication "token" }}
    remoteSecret: {{ $value.secret }}
    {{- else if eq $.Values.dr.authentication "tls" }}
    remoteSecret: {{ $value.secret }}-tls
    {{- end }}
{{- end }}
{{ end }}
{{ end }}
