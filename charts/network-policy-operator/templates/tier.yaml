{{- if .Capabilities.APIVersions.Has "projectcalico.org/v3/Tier" }}
apiVersion: projectcalico.org/v3
kind: Tier
metadata:
  name: {{ .Values.networkPolicies.defaultTier }}
spec:
  {{- if .Values.networkPolicies.onEKS }}
  defaultAction: Deny
  {{- else }}
  defaultAction: Pass
  {{- end }}
  order: 10000
{{- end }}
