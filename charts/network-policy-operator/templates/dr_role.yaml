{{- if .Values.dr.install }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    {{- include "network-policy-operator.labels" . | nindent 4 }}
  name: {{ include "network-policy-operator.remoteRole" . }}
rules:
- apiGroups:
  - qubership.org
  resources:
  - externalnamespaces
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - qubership.org
  resources:
  - externalnamespaces/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - qubership.org
  resources:
  - remoteclusterconfigs
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - qubership.org
  resources:
  - remoteclusterconfigs/finalizers
  verbs:
  - update
{{- end }}
