{{- if .Values.dr.install }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    {{- include "network-policy-operator.labels" . | nindent 4 }}
  name: {{ .Values.dr.localCluster.name }}-rb
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "network-policy-operator.remoteRole" . }}
subjects:
- kind: ServiceAccount
  name: {{ .Values.dr.localCluster.name }}
  namespace: {{ include "network-policy-operator.namespace" . }}
- kind: User 
  name: {{ .Values.dr.localCluster.secret }}-tls
{{- end }}
