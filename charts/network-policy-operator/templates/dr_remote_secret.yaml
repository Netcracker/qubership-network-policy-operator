{{- $outer := . -}}
{{- if .Values.dr.install }}
{{- range $key, $value := .Values.dr.remoteClusters }}
{{- with $outer -}}
---
apiVersion: v1
kind: Secret
metadata:
  annotations:
    kubernetes.io/service-account.name: {{ $value.name }}
  labels:
    {{- include "network-policy-operator.labels" . | nindent 4 }}
  name: {{ $value.secret }}
type: kubernetes.io/service-account-token
{{- end }}
{{ end }}
{{ end }}
