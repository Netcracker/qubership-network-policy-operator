apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "network-policy-operator.upgrade.name" . }}
  namespace: {{ include "network-policy-operator.namespace" . }}
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
  labels:
    {{- include "network-policy-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: upgrade
data:
  kubeconfig: |
    apiVersion: v1
    clusters:
    - cluster:
        insecure-skip-upgrade-verify: true
        server: https://kubernetes.default.svc.cluster.local
      name: cluster.local
    contexts:
    - context:
        cluster: kubernetes.default.svc.cluster.local
        user: {{ include "network-policy-operator.upgrade.name" . }}
      name: {{ include "network-policy-operator.upgrade.name" . }}
    current-context: {{ include "network-policy-operator.upgrade.name" . }}
    kind: Config
    preferences: {}
    users:
    - name: {{ include "network-policy-operator.upgrade.name" . }}
      user:
        token: 
