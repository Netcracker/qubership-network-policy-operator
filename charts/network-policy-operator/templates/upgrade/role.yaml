{{- if .Values.dr.install }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "network-policy-operator.upgrade.name" . }}
  namespace: {{ include "network-policy-operator.namespace" . }}
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
  labels:
    {{- include "network-policy-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: upgrade
rules:
- apiGroups:
    - ""
  resources:
    - configmaps
  verbs:
    - get
    - list
    - watch
- apiGroups:
    - "apps"
  resources:
    - deployments
    - deployments/scale
  verbs:
    - "*"
- apiGroups:
    - netcracker.com
  resources:
    - remoteclusterconfigs
  verbs:
    - get
    - list
    - watch
    - patch
    - update
{{- end }}
