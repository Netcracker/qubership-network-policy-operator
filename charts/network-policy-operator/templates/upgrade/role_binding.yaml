apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "network-policy-operator.upgrade.name" . }}
  namespace: {{ include "network-policy-operator.namespace" . }}
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
  labels:
    {{- include "network-policy-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: upgrade
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "network-policy-operator.upgrade.name" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "network-policy-operator.upgrade.name" . }}
    namespace: {{ include "network-policy-operator.namespace" . }}
