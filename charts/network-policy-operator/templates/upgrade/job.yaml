{{- if .Values.dr.install }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "network-policy-operator.upgrade.name" . }}
  namespace: {{ include "network-policy-operator.namespace" . }}
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
  labels:
    {{- include "network-policy-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: upgrade 
spec:
{{- if .Capabilities.APIVersions.Has "batch/v1alpha1" }}
  # Alpha feature since k8s 1.12
  ttlSecondsAfterFinished: 0
{{- end }}
  template:
    metadata:
      name: {{ include "network-policy-operator.upgrade.name" . }}
      labels:
        {{- include "network-policy-operator.labels" . | nindent 8 }}
        app.kubernetes.io/component: upgrade 
    spec:
      containers:
        - name: create
          image: {{ template "upgradejob.image" . }}
          imagePullPolicy: {{ .Values.dr.upgradeJob.pullPolicy }}
          args:
            - /upgrade.sh
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.namespace
            - name: DEPLOYMENT_NAME
              value: {{ include "network-policy-operator.fullname" . }}
          {{- if .Values.dr.upgradeJob.resources }}
          resources: {{ toYaml .Values.dr.upgradeJob.resources | nindent 12 }}
          {{- end }}
          volumeMounts:
            - mountPath: /tmp/cm
              name: kubeconfig
          {{- if .Values.dr.upgradeJob.securityContext }}
          securityContext: {{ toYaml .Values.dr.upgradeJob.securityContext | nindent 12 }}
          {{- end }}
      restartPolicy: OnFailure
      serviceAccountName: {{ include "network-policy-operator.upgrade.name" . }}
      volumes:
        - name: kubeconfig
          configMap:
            name: {{ include "network-policy-operator.upgrade.name" . }}
    {{- if .Values.dr.upgradeJob.nodeSelector }}
      nodeSelector: {{ toYaml .Values.dr.upgradeJob.nodeSelector | nindent 8 }}
    {{- end }}
    {{- if .Values.dr.upgradeJob.tolerations }}
      tolerations: {{ toYaml .Values.dr.upgradeJob.tolerations | nindent 8 }}
    {{- end }}
{{- end }}
