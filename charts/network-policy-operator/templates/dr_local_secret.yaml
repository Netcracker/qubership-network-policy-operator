{{- if .Values.dr.install }}
apiVersion: v1
kind: Secret
metadata:
  annotations:
    kubernetes.io/service-account.name: {{ .Values.dr.localCluster.name }}
  labels:
    {{- include "network-policy-operator.labels" . | nindent 4 }}
  name: {{ .Values.dr.localCluster.secret }}
type: kubernetes.io/service-account-token
{{- end }}
