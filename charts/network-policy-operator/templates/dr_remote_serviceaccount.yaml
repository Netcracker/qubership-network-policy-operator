{{- $outer := . -}}
{{- if .Values.dr.install }}
{{- range $key, $value := .Values.dr.remoteClusters }}
{{- with $outer -}}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $value.name }}
  labels:
    {{- include "network-policy-operator.labels" . | nindent 4 }}
secrets:
- name: {{ $value.secret }}
{{- end }}
{{ end }}
{{ end }}
