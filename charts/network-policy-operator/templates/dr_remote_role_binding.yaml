{{- $outer := . -}}
{{- if .Values.dr.install }}
{{- range $key, $value := .Values.dr.remoteClusters }}
{{- with $outer -}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    {{- include "network-policy-operator.labels" . | nindent 4 }}
  name: {{ $value.name }}-rb
  namespace: {{ include "network-policy-operator.namespace" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "network-policy-operator.remoteRole" . }}
subjects:
- kind: ServiceAccount
  name: {{ $value.name }}
  namespace: {{ include "network-policy-operator.namespace" . }}
{{- end }}
{{ end }}
{{ end }}
