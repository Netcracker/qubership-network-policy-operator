{{- if (ne (include "network-policy-operator.restrictedEnvironment" .) "true") }}
{{- if .Values.authProxy.rbac.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.authProxy.rbac.metrics }}
  labels:
    {{- include "network-policy-operator.labels" . | nindent 4 }}
secrets:
- name: {{ .Values.authProxy.rbac.metrics }}-token
---
apiVersion: v1
kind: Secret
metadata:
  annotations:
    kubernetes.io/service-account.name: {{ .Values.authProxy.rbac.metrics }}
  labels:
    {{- include "network-policy-operator.labels" . | nindent 4 }}
  name: {{ .Values.authProxy.rbac.metrics }}-token
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    {{- include "network-policy-operator.labels" . | nindent 4 }}
  name: {{ .Values.authProxy.rbac.metrics }}-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.authProxy.rbac.metrics }}
subjects:
- kind: ServiceAccount
  name: {{ .Values.authProxy.rbac.metrics }}
  namespace: {{ include "network-policy-operator.namespace" . }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    {{- include "network-policy-operator.labels" . | nindent 4 }}
  name: {{ .Values.authProxy.rbac.metrics }}
rules:
- nonResourceURLs:
  - "/metrics"
  verbs:
  - get
{{- end }}
{{- end }}
