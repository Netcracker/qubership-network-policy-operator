{{- if .Values.dr.install }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "network-policy-operator.restart.name" . }}
  namespace: {{ include "network-policy-operator.namespace" . }}
  annotations:
    "helm.sh/hook": pre-upgrade,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
  labels:
    {{- include "network-policy-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: restart
rules:
- apiGroups:
    - ""
  resources:
    - secrets
  verbs:
    - get
    - list
    - watch
- apiGroups:
    - ""
  resources:
    - configmaps
  verbs:
    - get
    - list
    - watch
- apiGroups:
    - netcracker.com
  resources:
    - remoteclusterconfigs
  verbs:
    - get
    - list
    - watch
{{- end }}
