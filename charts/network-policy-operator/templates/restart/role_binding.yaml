{{- if .Values.dr.install }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "network-policy-operator.restart.name" . }}
  namespace: {{ include "network-policy-operator.namespace" . }}
  annotations:
    "helm.sh/hook": pre-upgrade,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
  labels:
    {{- include "network-policy-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: restart
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "network-policy-operator.restart.name" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "network-policy-operator.restart.name" . }}
    namespace: {{ include "network-policy-operator.namespace" . }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "network-policy-operator.restart.name" . }}
  annotations:
    "helm.sh/hook": pre-upgrade,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
  labels:
    {{- include "network-policy-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: restart
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "network-policy-operator.restart.name" . }}
subjects:
- kind: ServiceAccount
  name: {{ include "network-policy-operator.restart.name" . }}
  namespace: {{ include "network-policy-operator.namespace" . }}
{{- end }}
