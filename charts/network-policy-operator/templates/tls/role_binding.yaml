{{- if .Values.dr.install }}
{{- if and (eq .Values.dr.authentication "tls") (eq .Values.dr.tls "auto") }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "network-policy-operator.tls.name" . }}
  namespace: {{ include "network-policy-operator.namespace" . }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade,post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
  labels:
    {{- include "network-policy-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: tls
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "network-policy-operator.tls.name" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "network-policy-operator.tls.name" . }}
    namespace: {{ include "network-policy-operator.namespace" . }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "network-policy-operator.tls.name" . }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade,post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
  labels:
    {{- include "network-policy-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: tls
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "network-policy-operator.tls.name" . }}
subjects:
- kind: ServiceAccount
  name: {{ include "network-policy-operator.tls.name" . }}
  namespace: {{ include "network-policy-operator.namespace" . }}
{{- end }}
{{- end }}
