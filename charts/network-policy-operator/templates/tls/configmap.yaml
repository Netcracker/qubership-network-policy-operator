{{- if .Values.dr.install }}
{{- if and (eq .Values.dr.authentication "tls") (eq .Values.dr.tls "auto") }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "network-policy-operator.tls.name" . }}
  namespace: {{ include "network-policy-operator.namespace" . }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade,post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
  labels:
    {{- include "network-policy-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: tls
data:
  kubeconfig: |
    apiVersion: v1
    clusters:
    - cluster:
        insecure-skip-tls-verify: true
        server: https://kubernetes.default.svc.cluster.local
      name: cluster.local
    contexts:
    - context:
        cluster: kubernetes.default.svc.cluster.local
        user: {{ include "network-policy-operator.tls.name" . }}
      name: {{ include "network-policy-operator.tls.name" . }}
    current-context: {{ include "network-policy-operator.tls.name" . }}
    kind: Config
    preferences: {}
    users:
    - name: {{ include "network-policy-operator.tls.name" . }}
      user:
        token: 
{{- end }}
{{- end }}
