# permissions for end users to edit externalnamespaces.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: clusterrole
    app.kubernetes.io/instance: externalnamespace-editor-role
    app.kubernetes.io/component: rbac
    app.kubernetes.io/created-by: npcv1
    app.kubernetes.io/part-of: npcv1
    app.kubernetes.io/managed-by: kustomize
  name: externalnamespace-editor-role
rules:
- apiGroups:
  - netcracker.com
  resources:
  - externalnamespaces
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - netcracker.com
  resources:
  - externalnamespaces/status
  verbs:
  - get
