# permissions for end users to view networkpolicyconfigs.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: clusterrole
    app.kubernetes.io/instance: networkpolicyconfig-viewer-role
    app.kubernetes.io/component: rbac
    app.kubernetes.io/created-by: npcv1
    app.kubernetes.io/part-of: npcv1
    app.kubernetes.io/managed-by: kustomize
  name: networkpolicyconfig-viewer-role
rules:
- apiGroups:
  - qubership.org
  resources:
  - networkpolicyconfigs
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - qubership.org
  resources:
  - networkpolicyconfigs/status
  verbs:
  - get
