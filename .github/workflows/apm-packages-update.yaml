name: Update APM packages

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch: null

permissions:
  contents: read
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.APM_UPDATE_TOKEN }}
          persist-credentials: false

      - name: Update APM packages
        uses: netcracker/qubership-workflow-hub/actions/apm-packages-update@288a6a0d9a78e80dfdefccab1be6497a39deb746 # v2.8.0
        with:
          branch: main
          token: ${{ secrets.APM_UPDATE_TOKEN }}
